<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="660" viewBox="0 0 1140 660">
 <rect width="1140" height="660" rx="16" fill="#f8faf9"/>
 <g font-family="sans-serif" fill="#203f36">
  <text x="32" y="40" font-size="23" font-weight="bold">자동 급수 · UNO + 토양 센서 + MOSFET + 12V 펌프</text>
  <text x="32" y="66" font-size="13" fill="#637970">제조사 핀 정보를 사용한 참조 설계 · 실제 센서 보정·전원·펌프 전류 확인 필요</text>
  <rect x="35" y="130" width="155" height="170" rx="8" fill="#237b73"/>
  <g fill="white"><text x="55" y="165" font-size="17">Arduino UNO</text><text x="155" y="205">A0</text><text x="155" y="250">D5</text><text x="46" y="285">5V</text><text x="104" y="285">GND</text></g>
  <rect x="35" y="380" width="180" height="95" rx="7" fill="#e1eee7" stroke="#3b7a5a"/>
  <text x="50" y="408" font-size="15">S1 · SEN0193</text><text x="50" y="433" font-size="12">VCC / GND / SIG</text><text x="50" y="454" font-size="12">출력 0–3V → A0</text>
  <g fill="none" stroke="#239b76" stroke-width="3">
   <path d="M190 200 H238 V355 H190 V380"/><path d="M60 300 V380"/>
   <path d="M190 245 H270 M325 245 H500"/>
   <path d="M500 245 V300 M500 355 V485"/>
  </g>
  <g fill="white" stroke="#315b49" stroke-width="2"><rect x="270" y="236" width="55" height="18"/><rect x="491" y="300" width="18" height="55"/></g>
  <text x="265" y="223" font-size="13">RG1 · 330Ω</text><text x="350" y="329" font-size="13">RPD1 · 100kΩ</text>
  <g fill="none" stroke="#304c60" stroke-width="3">
   <path d="M500 245 H565 M565 213 V280 M580 210 V236 M580 249 V280 M580 210 H615 V183 M580 280 H615 V485"/>
   <path d="M615 183 V120 H920 V131 M615 485 H970 V450"/>
  </g>
  <text x="505" y="174" font-size="14">Q1 · IRLZ44N</text><text x="528" y="273" font-size="12">1 G</text><text x="627" y="203" font-size="12">2 D</text><text x="627" y="300" font-size="12">3 S</text>
  <circle cx="920" cy="166" r="35" fill="white" stroke="#36617b" stroke-width="3"/><text x="909" y="176" font-size="26">M</text>
  <text x="810" y="224" font-size="14">M1 · 12V 펌프 #1150</text><text x="850" y="247" font-size="12">200–300mA 동작</text>
  <path d="M920 201 V285 H1098 M970 285 V355" fill="none" stroke="#c75744" stroke-width="4"/>
  <rect x="916" y="355" width="170" height="95" rx="7" fill="#e9edf0" stroke="#586e7b"/>
  <text x="930" y="382" font-size="16">PS1 · 별도 12V</text><text x="930" y="407" font-size="12">+ 빨강 / − 검정</text>
  <text x="925" y="121" font-size="14">−</text><text x="926" y="220" font-size="14">+</text>
  <g fill="none" stroke="#304c60" stroke-width="2.5">
   <path d="M760 120 V165 M760 190 V285 H970"/><path d="M745 165 H775 L760 189 Z"/><path d="M743 190 H777"/>
   <path d="M1098 285 V310 M1081 310 H1115 M1081 323 H1115 M1098 323 V485 H970"/>
   <path d="M690 120 V152 M676 152 H704 M676 163 H704 M690 163 V285 H920"/>
   <path d="M120 300 V330 H15 V485 H615 M120 330 V380"/>
  </g>
  <g fill="#203f36" font-size="12"><text x="772" y="157">D2 · 1N5822</text><text x="772" y="179">A → 펌프 −</text><text x="772" y="201">띠 C → 펌프 +</text><text x="1054" y="307">C1 +</text><text x="988" y="344">470µF / 25V</text><text x="660" y="104">C2 · 100nF</text><text x="316" y="507">UNO GND = MOSFET S = 12V −</text></g>
  <g fill="#315b49"><circle cx="500" cy="245" r="4"/><circle cx="615" cy="120" r="4"/><circle cx="760" cy="120" r="4"/><circle cx="760" cy="285" r="4"/><circle cx="920" cy="285" r="4"/><circle cx="615" cy="485" r="4"/></g>
  <text x="32" y="554" font-size="14">센서 → UNO 코드 → 게이트 → 펌프 전류 → 급수 → 센서 피드백</text>
  <text x="32" y="580" font-size="12">게이트·상태 신호는 빵판에서 연결하며, 펌프 전류 경로는 단자대·납땜 보드로 구성합니다.</text>
  <text x="32" y="603" font-size="12">기준 500/360은 보정 전 예제값입니다. 15초 연속 구동·센서 상한 초과 시 코드가 출력을 끄고 Reset까지 잠깁니다.</text>
  <text x="32" y="626" font-size="12" fill="#a24b36">12V +를 UNO 5V에 연결하지 마세요. 표시용 LED와 직렬 1kΩ은 편집기에 포함되며 이 도면에서는 생략했습니다.</text>
 </g>
</svg>
